# Perfil dev: MySQL via Docker
spring.datasource.url=jdbc:mysql://${DB_HOST:db}:3306/${DB_NAME:printai}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:printai}
spring.datasource.password=${DB_PASS:printai123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Garante que o JPA cria as tabelas antes do seed.sql rodar
spring.jpa.defer-datasource-initialization=true

# Seed de dados de referência (tipos, tecnologias, materiais)
# INSERT IGNORE garante idempotência — pode reiniciar sem duplicar
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:db/seed.sql
