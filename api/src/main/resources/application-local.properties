# Perfil local: MySQL local para desenvolvimento sem Docker
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME:printai}?useSSL=false&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo&characterEncoding=UTF-8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:printai}
spring.datasource.password=${DB_PASS:printai123}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:db/seed.sql
